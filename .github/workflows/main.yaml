name: Model Training Pipeline

on: [push] # Chạy mỗi khi có code mới được push


jobs:
  # ==================================================
  # JOB 1: CI - TRAIN MODEL TRÊN KAGGLE (Của bạn)
  # ==================================================
  run-training:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. Cài đặt Python & CML
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Kaggle Config
        run: |
          pip install kaggle jq
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      # 2. PUSH CODE VÀ TỰ QUẢN LÝ VIỆC CHỜ ĐỢI (POLLING)
      - name: Push Kernel and Poll for Status
        id: kaggle_process
        env:
          KERNEL_SLUG: ${{ secrets.KAGGLE_USERNAME }}/detection-system-training
          # Đặt tên biến môi trường khớp với lệnh sed bên dưới
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }} 
        run: |
          echo "💉 Đang tiêm Token vào code (Bước này đang thiếu nè)..."
          # 1. TIÊM TOKEN (QUAN TRỌNG NHẤT - KHÔNG ĐƯỢC BỎ QUA)
          # Tìm chữ PLACEHOLDER thay bằng Token thật
          sed -i "s|DAGSHUB_TOKEN_PLACEHOLDER|${DAGSHUB_TOKEN}|g" kaggle_runner.py

          # Kiểm tra nhẹ xem file đã đổi chưa (che bớt token để bảo mật log)
          echo "Kiểm tra file sau khi inject (chỉ in 5 dòng đầu):"
          head -n 5 kaggle_runner.py

          echo "🚀 Đẩy code lên Kaggle..."
          kaggle kernels push -p .

          # 2. NGỦ ĐỂ TRÁNH LỖI NHẬN DIỆN SAI TRẠNG THÁI
          echo "💤 Ngủ 60s để Kaggle kịp reset trạng thái..."
          sleep 60 

          # 3. DỌN DẸP FILE (Hoàn tác việc sửa token để git sạch sẽ)
          git checkout kaggle_runner.py 

          echo "⏳ Bắt đầu theo dõi trạng thái..."
          
          # Tắt chế độ "hễ lỗi là dừng" để vòng lặp chạy bền bỉ
          set +e 
          status="running"
          
          while [[ "$status" != "complete" && "$status" != "error" ]]; do
            sleep 60
            
            full_status=$(kaggle kernels status $KERNEL_SLUG)
            echo "🔍 Raw output: $full_status"
            
            # LOGIC XỬ LÝ TRẠNG THÁI THÔNG MINH
            if [[ "$full_status" == *"COMPLETE"* ]] || [[ "$full_status" == *"complete"* ]]; then
              status="complete"
            elif [[ "$full_status" == *"ERROR"* ]] || [[ "$full_status" == *"error"* ]]; then
              status="error"
            else
              status="running"
            fi
            
            echo "Current Status Parsed: $status"
          done

          # Bật lại chế độ bắt lỗi
          set -e

          if [[ "$status" == "error" ]]; then
            echo "❌ Training bị lỗi! Đang tải log về..."
            kaggle kernels output $KERNEL_SLUG -p ./logs
            cat ./logs/*.log
            exit 1
          else
            echo "✅ Training hoàn tất!"
          fi

  # ==================================================
  # JOB 2: CD - DEPLOY LÊN AZURE SERVER (Mới thêm)
  # ==================================================

  deploy-to-azure:
    needs: run-training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/src/api/Dockerfile.api
          push: true
          # Đổi tên user cho đúng của bạn
          tags: ${{ secrets.DOCKER_USERNAME }}/api_flow:latest

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }} # Ví dụ: quyromnguyen
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "📥 Đang kéo image mới nhất về..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/api_flow:latest
            
            echo "🛑 Đang tắt container cũ..."
            sudo docker stop ai_server || true
            sudo docker rm ai_server || true
            
            echo "🧹 Dọn dẹp rác (Image cũ)..."
            sudo docker image prune -f

            echo "🚀 Khởi động server mới..."
            # Lưu ý: File .env phải có sẵn trên server rồi nhé
            sudo docker run -d \
              --name ai_server \
              --restart always \
              --env-file .env \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/api_flow:latest